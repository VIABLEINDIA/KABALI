# KABALI intraday bot configuration.
#
# Every number here is a risk decision, not a tuning knob. The ones under
# `risk:` are enforced by kabali.risk.circuit as hard stops -- the engine
# refuses to trade rather than exceeding them.

account:
  capital: 40000.0          # rupees actually allocated to this bot
  currency: INR
  # Dhan MIS leverage varies per scrip (roughly 2x-5x). We never assume the
  # broker's maximum: gross exposure is capped independently below, so a
  # leverage change on Dhan's side cannot silently enlarge our position.
  assumed_mis_leverage: 4.0

risk:
  daily_loss_limit_pct: 2.0     # 800 on 40k -- hard kill switch for the session
  daily_profit_lock_pct: 3.0    # stop trading after +1200; protects a good day
  per_trade_risk_pct: 0.5       # 200 at risk per trade, measured entry->stop
  max_concurrent_positions: 4   # 800 budget / 200 per trade
  max_gross_exposure_mult: 3.0  # <= 120k notional open at once, under the 4x MIS
  max_position_notional_pct: 30.0   # <= 30% of gross cap in any single name
  max_trades_per_day: 12        # cost drag ceiling; 12 round trips ~= 250 rupees
  max_consecutive_losses: 4     # pause the session; usually a regime the rules misread
  # A position whose stop implies a size below this is not worth the fixed
  # per-order brokerage. Skipped rather than sized down.
  min_position_notional: 5000.0

session:
  timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  opening_range_end: "09:30"   # first 15 minutes define the OR; no entries before
  entry_cutoff: "14:45"        # no NEW entries after this
  square_off: "15:10"          # flatten everything; ahead of broker auto-squareoff

universe:
  size: 250                    # scanned daily; NOT held -- risk caps hold count to 4
  candidate_series: [EQ]       # NSE EQ series only; SM/BE/SG are illiquid or non-MIS
  history_years: 5
  min_price: 50.0              # sub-50 names: tick size is a large fraction of ATR
  max_price: 15000.0
  min_median_turnover: 50000000.0   # 5 crore/day median; our size must be invisible
  min_history_bars: 500        # needs real history to rank momentum on
  max_participation_pct: 1.0   # our order <= 1% of median daily volume

regime:
  benchmark: NIFTY
  breadth_sample: 100          # top-N universe names used for the breadth reading
  trend_fast: 20
  trend_slow: 50
  trend_anchor: 200
  atr_window: 14
  high_vol_percentile: 80      # ATR% above this percentile = volatile regime
  low_vol_percentile: 20

costs:
  profile: equity_intraday     # research.costs PRESETS; fingerprinted into results
  slippage_bps: 5.0            # per side, on top of the statutory model

# The swing venue: multi-week CNC positions on daily bars. A different edge on
# the same risk discipline, not a retune of the intraday one -- the hypothesis,
# and everything that would falsify it, is pre-registered in
# docs/swing_hypothesis.md.
swing:
  risk:                          # how much to lose: a property of the account
    per_trade_risk_pct: 1.2      # 480 on 40k, entry->stop, costs included
    max_concurrent_positions: 5  # 6% of equity at risk if all five stop at once
    max_gross_exposure_mult: 1.0 # CNC is cash-settled; there is no MIS leverage
    max_position_notional_pct: 30.0
    min_position_notional: 5000.0
    drawdown_pause_pct: 12.0     # stop OPENING below this; the intraday daily
                                 # loss circuit deliberately does not apply here
  rules:                         # what to buy: Clenow, Stocks on the Move (2015)
    rank_window: 90              # exp-regression slope x R^2, 90 sessions
    trend_ma: 100                # hold only above the 100d SMA
    index_ma: 200                # no new entries with NIFTY below its 200d SMA
    gap_window: 90
    max_gap_pct: 15.0            # exclude names that gapped more than this
    exit_rank_pct: 20.0          # leave when out of the top 20% of the ranking
    atr_window: 20
    stop_atr_mult: 3.0           # trailing stop, and the sizing unit
    rebalance_weekday: 2         # Wednesday, Clenow's own choice
    min_history_bars: 100
    turnover_window: 100
  costs:
    profile: equity_delivery     # STT is 0.1% PER SIDE on delivery, not 0.025%
    slippage_bps: 3.0

execution:
  mode: paper                  # paper | live. `live` additionally requires the gate.
  gate_file: state/LIVE_GATE.json
  order_product: INTRADAY
  order_type: MARKET
